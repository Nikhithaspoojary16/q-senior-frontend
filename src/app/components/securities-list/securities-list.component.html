<filterable-table
  class="security-list"
  [dataSource]="securities$ | async"
  [isLoading]="loadingSecurities$ | async"
  (filterChange)="onFilterChange($event)"
  (pageChange)="onPageChange($event)"
  [availableCurrencies]="availableCurrencies"
  [availableTypes]="availableTypes"
  [nameLabel]="columnLabels.name"
  [typeLabel]="columnLabels.type"
  [currencyLabel]="columnLabels.currency"
  [totalCount]="totalCount"
>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>{{ columnLabels.name }}</th>
    <td mat-cell *matCellDef="let security">{{ security.name }}</td>
  </ng-container>

  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>{{ columnLabels.type }}</th>
    <td mat-cell *matCellDef="let security">{{ security.type }}</td>
  </ng-container>

  <ng-container matColumnDef="currency">
    <th mat-header-cell *matHeaderCellDef>{{ columnLabels.currency }}</th>
    <td mat-cell *matCellDef="let security">{{ security.currency }}</td>
  </ng-container>

  <!-- Custom row definitions to be provided to the wrapper table. -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  <!-- Row shown when there is no matching data that will be provided to the wrapper table. -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="3"><i>No data</i></td>
  </tr>
</filterable-table>
